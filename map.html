<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorează Konoha</title><link rel="stylesheet" href="./style.css"></head><body><main class="app explore-wrap"><div class="topbar"><div class="brand"><small>SHINOBI LEGENDS 3D</small><h1>🗺️ Explorează Konoha</h1></div><a class="quick-tool" href="./index.html">← Acasă</a></div><p class="muted">Deplasează ninja cu săgețile, WASD sau butoanele. Aceasta este o hartă 2D demonstrativă.</p><div class="explore-map" id="map"><div class="map-water"></div><div class="map-road"></div><span class="map-building" style="left:18%;top:20%">🏯</span><span class="map-building" style="left:70%;top:32%">🏠</span><span class="map-building" style="left:27%;top:70%">🍜</span><span class="map-building" style="left:78%;top:72%">🏪</span><span class="map-tree" style="left:8%;top:45%">🌳</span><span class="map-tree" style="left:52%;top:15%">🌲</span><span class="map-tree" style="left:58%;top:75%">🌳</span><span class="map-tree" style="left:38%;top:35%">🌲</span><span id="player" class="player-token">🥷</span></div><div class="map-controls"><button data-move="up">⬆️</button><button data-move="left">⬅️</button><button data-move="down">⬇️</button><button data-move="right">➡️</button></div><p class="map-note" id="coords">Poziție: 50%, 50% · Konoha</p></main><script>let x=50,y=50;const p=document.getElementById('player'),c=document.getElementById('coords');function move(dx,dy){x=Math.max(4,Math.min(96,x+dx));y=Math.max(5,Math.min(95,y+dy));p.style.left=x+'%';p.style.top=y+'%';c.textContent='Poziție: '+Math.round(x)+'%, '+Math.round(y)+'% · Konoha'}document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let d=b.dataset.move;move(d==='left'?-3:d==='right'?3:0,d==='up'?-3:d==='down'?3:0)});document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','w'].includes(k))move(0,-2);if(['arrowdown','s'].includes(k))move(0,2);if(['arrowleft','a'].includes(k))move(-2,0);if(['arrowright','d'].includes(k))move(2,0)});</script></body></html>
